<script>
function renderCartPage() {
  const root = document.getElementById('cart-root');
  const cart = getCart();

  if (!cart.length) {
    root.innerHTML = `
      <div class="cart-empty">
        <p>Your cart is empty.</p>
        <a href="index.html" class="btn btn-primary">Continue Shopping</a>
      </div>`;
    return;
  }

  const rows = cart.map(item => {
    const key = cartItemKey(item);
    return `
    <div class="cart-row" data-id="${key}">
      <img class="cart-row-photo" src="${item.photo}" alt="${item.name}">
      <div class="cart-row-info">
        <div class="cart-row-name">${item.name}</div>
        ${item.size ? `<div class="cart-row-attrs">Size: ${item.size}</div>` : ''}
        ${item.attributesSummary ? `<div class="cart-row-attrs">${item.attributesSummary}</div>` : ''}
        <div class="cart-row-stock ${item.stockStatus}">${stockBadgeLabel(item.stockStatus)}</div>
        <button class="cart-row-remove" data-id="${key}" type="button">Remove</button>
      </div>
      <div class="qty-control">
        <button type="button" class="qty-minus" data-id="${key}" aria-label="Decrease quantity">−</button>
        <input type="number" class="qty-input" data-id="${key}" value="${item.qty}" min="0">
        <button type="button" class="qty-plus" data-id="${key}" aria-label="Increase quantity">+</button>
      </div>
      <div class="cart-row-price">Rs. ${(item.price * item.qty).toLocaleString('en-IN')}</div>
    </div>`;
  }).join('');

  root.innerHTML = `
    ${rows}
    <div class="cart-summary">
      <span>Subtotal</span>
      <span>Rs. ${cartTotal(cart).toLocaleString('en-IN')}</span>
    </div>
    <div style="display:flex; gap:12px; flex-wrap:wrap; justify-content:flex-end;">
      <a href="index.html" class="btn btn-ghost">Continue Shopping</a>
      <a href="checkout.html" class="btn btn-gold">Proceed to Checkout</a>
    </div>`;
}

// Event delegation on the container itself — attached once, never rebound,
// so repeated qty +/- or remove clicks always work no matter how many times
// renderCartPage() has replaced the row markup underneath.
document.addEventListener('DOMContentLoaded', () => {
  const root = document.getElementById('cart-root');

  root.addEventListener('click', (e) => {
    const minusBtn = e.target.closest('.qty-minus');
    const plusBtn = e.target.closest('.qty-plus');
    const removeBtn = e.target.closest('.cart-row-remove');

    if (minusBtn) {
      const item = getCart().find(i => cartItemKey(i) === minusBtn.dataset.id);
      if (item) setQty(cartItemKey(item), item.qty - 1);
      renderCartPage();
    } else if (plusBtn) {
      const item = getCart().find(i => cartItemKey(i) === plusBtn.dataset.id);
      if (item) setQty(cartItemKey(item), item.qty + 1);
      renderCartPage();
    } else if (removeBtn) {
      removeFromCart(removeBtn.dataset.id);
      renderCartPage();
    }
  });

  root.addEventListener('change', (e) => {
    if (!e.target.classList.contains('qty-input')) return;
    const qty = Math.max(0, parseInt(e.target.value || '0', 10));
    setQty(e.target.dataset.id, qty);
    renderCartPage();
  });

  renderCartPage();
});
</script>
