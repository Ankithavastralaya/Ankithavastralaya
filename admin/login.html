<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Admin Login — Ankitha Vastralaya</title>
<link rel="icon" href="../hero-images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
  body{ display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .login-card{
    background:var(--white); border:1px solid var(--line); border-radius:var(--radius);
    padding:40px 32px; width:100%; max-width:360px;
  }
  .login-card h1{ font-size:22px; text-align:center; margin-bottom:6px; }
  .login-card p.sub{ text-align:center; color:var(--text-muted); font-size:13px; margin:0 0 24px; }
  .login-error{ color:var(--maroon); font-size:13px; margin-top:12px; text-align:center; display:none; }
  .login-error.show{ display:block; }
  .password-field{ position:relative; }
  .password-field input{ padding-right:42px; }
  .password-toggle{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    background:none; border:none; cursor:pointer; color:var(--text-muted); padding:6px;
    display:flex; align-items:center; justify-content:center;
  }
  .password-toggle:hover{ color:var(--ink); }
  .password-toggle svg{ width:19px; height:19px; }
  .password-toggle .icon-eye-off{ display:none; }
  .password-toggle.showing .icon-eye{ display:none; }
  .password-toggle.showing .icon-eye-off{ display:block; }
</style>
</head>
<body>

<div class="login-card">
  <a href="../index.html" style="display:flex; justify-content:center; margin-bottom:18px;">
    <img src="../hero-images/logo.png" alt="Ankitha Vastralaya" style="height:80px;">
  </a>
  <h1>Admin Login</h1>
  <p class="sub">Sign in to manage your store</p>
  <form id="login-form" novalidate>
    <div class="field">
      <label for="f-email">Email</label>
      <input id="f-email" type="email" required autocomplete="username">
    </div>
    <div class="field">
      <label for="f-password">Password</label>
      <div class="password-field">
        <input id="f-password" type="password" required autocomplete="current-password">
        <button type="button" class="password-toggle" id="password-toggle" aria-label="Show password">
          <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-3.22 4.4M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
    </div>
    <button type="submit" class="btn btn-primary btn-block" id="login-btn">Sign In</button>
    <p class="login-error" id="login-error"></p>
  </form>
  <div id="otp-section" style="display:none;">
    <p class="sub" style="margin-top:16px;">Enter the 6-digit code sent to your phone</p>
    <div class="field">
      <label for="f-otp">Verification Code</label>
      <input id="f-otp" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
    </div>
    <button type="button" class="btn btn-primary btn-block" id="otp-verify-btn">Verify</button>
  </div>
  <div id="recaptcha-container"></div>
</div>

<script>
  document.getElementById('password-toggle').addEventListener('click', () => {
    const input = document.getElementById('f-password');
    const btn = document.getElementById('password-toggle');
    const showing = input.type === 'password';
    input.type = showing ? 'text' : 'password';
    btn.classList.toggle('showing', showing);
    btn.setAttribute('aria-label', showing ? 'Hide password' : 'Show password');
  });
</script>
<script type="module" src="js/admin-auth.js"></script>
</body>
</html>
